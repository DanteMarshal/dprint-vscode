name: Validate and release extension

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (stable VS Code)
            os: ubuntu-latest
            vscode: stable
          - name: macOS (stable VS Code)
            os: macos-latest
            vscode: stable
          - name: Windows (stable VS Code)
            os: windows-latest
            vscode: stable
          - name: Linux (VS Code 1.82.0)
            os: ubuntu-latest
            vscode: 1.82.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - name: Run LSP integration tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
      - name: Run LSP integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run package -- --out dprint-vscode-${{ github.ref_name }}.vsix
      - run: xvfb-run -a npm run test:vsix -- dprint-vscode-${{ github.ref_name }}.vsix

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dprint-vscode-${{ github.ref_name }}.vsix
